<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nossa Senhora da Imaculada Conceição">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C9A0"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#E8C9A0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Halo circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)" stroke="url(#gold)" stroke-width="10"/>

  <!-- Rays (minimal, subtle) -->
  <g opacity="0.35" stroke="url(#gold)" stroke-width="6" stroke-linecap="round">
    <path d="M256 34v40"/>
    <path d="M256 438v40"/>
    <path d="M34 256h40"/>
    <path d="M438 256h40"/>
    <path d="M94 94l28 28"/>
    <path d="M390 390l28 28"/>
    <path d="M94 418l28-28"/>
    <path d="M390 122l28-28"/>
  </g>

  <!-- Marian monogram (M) -->
  <g filter="url(#soft)">
    <path d="M156 356V180h18l82 124 82-124h18v176h-24V225l-72 108h-8l-72-108v131h-24z"
      fill="url(#gold)"/>
  </g>

  <!-- Small cross above -->
  <g fill="url(#gold)" opacity="0.95">
    <rect x="248" y="110" width="16" height="54" rx="4"/>
    <rect x="230" y="128" width="52" height="16" rx="4"/>
  </g>
</svg>
